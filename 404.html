<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMO | جاري تحويلك للمنتج...</title>
<script>
  // استخراج رقم المنتج من الرابط تلقائياً أياً كان (59، 80، أو أي رقم مستقبلي)
  const path = window.location.pathname;
  const match = path.match(/\/product\/([^\/]+)/);
  if (match && match[1]) {
    const productId = match[1];
    window.location.replace(`https://amo-bags.github.io/#product=${productId}`);
  } else {
    window.location.replace(`https://amo-bags.github.io/`);
  }
</script>
</head>
<body style="background:#faf9f6; font-family:Tajawal, Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <h3 style="color:#332922; margin-bottom:10px;">جاري تحويلك لعرض المنتج في متجر AMO...</h3>
    <a href="https://amo-bags.github.io/" style="color:#c5a059; text-decoration:none; font-weight:bold;">انقر هنا للانتقال للمتجر مباشرة</a>
  </div>
</body>
</html>
