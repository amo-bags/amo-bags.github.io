name: Generate Product Previews

on:
  push:
    branches:
      - main
    paths:
      - 'products-new/**'
      - 'generate-previews.js'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run preview generator
        run: node generate-previews.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add product/
          git status
          git diff --staged --quiet || (git commit -m "Auto-generate product preview pages [skip ci]" && git push)
