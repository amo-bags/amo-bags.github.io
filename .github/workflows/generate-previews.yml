name: Generate Product Previews

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Preview Generator
        run: node generate-previews.js

      - name: Commit and push generated preview files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate product preview pages"
          branch: main
